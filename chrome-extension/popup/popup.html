<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Internly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Internly</h1>
      <p id="authWarning" style="color: #ff4d4d; font-size: 12px; margin-top: -10px; display: none;">
        ⚠ Not logged in. Please visit <a id="loginLink" href="#" style="color: inherit; text-decoration: underline;">the dashboard</a> to sync.
      </p>
      <button id="toggleViewBtn">View Saved Applications</button>

      <!-- NEW APPLICATION / EDIT VIEW -->
      <div id="newView">
        <p id="confidence"></p>
        <p id="warning"></p>

        <form id="applicationForm">
          <label>Company <input id="company" /></label>
          <label>Role <input id="role" /></label>

          <!-- STATUS (EDIT MODE ONLY) -->
          <label id="statusWrapper" hidden>
            Status
            <select id="status">
              <option value="Saved">Saved</option>
              <option value="Applied">Applied</option>
              <option value="Interview">Interview</option>
              <option value="Offer">Offer</option>
              <option value="Rejected">Rejected</option>
            </select>
          </label>

          <label>Stipend <input id="stipend" /></label>
          <label>Description <textarea id="description"></textarea></label>

          <button type="submit">Save</button>
          <button type="button" id="ignoreBtn">Ignore</button>
        </form>

        <p id="emptyState" hidden>No application detected.</p>
      </div>

      <!-- SAVED APPLICATIONS VIEW -->
      <div id="savedView" hidden>
        <h2>Saved Applications</h2>
        <ul id="savedList"></ul>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
